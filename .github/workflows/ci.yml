name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore creatioclient.sln

      - name: Build
        run: dotnet build creatioclient.sln --configuration Release --no-restore

      - name: Test
        shell: bash
        run: |
          if find . -name "*.Tests.csproj" -not -path "*/bin/*" -not -path "*/obj/*" | grep -q .; then
            dotnet test creatioclient.sln \
              --configuration Release \
              --no-build \
              --verbosity normal \
              --logger "trx;LogFileName=test-results-${{ matrix.os }}.trx"
          else
            echo "No *.Tests.csproj found; skipping test step."
          fi

      - name: Upload test results
        if: always() && hashFiles('**/TestResults/*.trx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
